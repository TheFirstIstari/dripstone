name: ci
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  ci:
    runs-on: [self-hosted, Linux, X64, cachyos-x8664]
    timeout-minutes: 15
    env:
      MIX_ENV: test
    steps:
      - uses: actions/checkout@v4
      - name: Cache mise tools
        uses: actions/cache@v4
        with:
          path: ~/.local/share/mise
          key: mise-${{ runner.os }}-${{ hashFiles('mise.toml') }}
      - uses: jdx/mise-action@v2
      - name: Cache hex/mix/deps/build
        uses: actions/cache@v4
        with:
          path: |
            ~/.hex
            ~/.mix
            deps
            _build/test
          key: mix-${{ runner.os }}-elixir1.20-otp28-${{ hashFiles('mix.lock', 'mise.toml') }}
          restore-keys: |
            mix-${{ runner.os }}-elixir1.20-otp28-
            mix-${{ runner.os }}-
      - run: mix local.hex --force && mix local.rebar --force
      - run: mix deps.get --only test
      - run: mix format --check-formatted
      - run: mix compile --warnings-as-errors --force
      - run: docker compose up -d db
      - run: |
          for i in $(seq 1 30); do
            pg_isready -h localhost -U postgres && break
            sleep 1
          done
          pg_isready -h localhost -U postgres
      - run: mix ecto.create
      - run: mix ecto.migrate
      - run: mix test
