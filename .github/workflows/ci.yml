name: ci
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  ci:
    runs-on: [self-hosted, Linux, X64, cachyos-x8664]
    timeout-minutes: 30
    env:
      MIX_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
        with:
          cache: false
      - run: mix local.hex --force && mix local.rebar --force
      - run: mix deps.get
      - run: mix deps.unlock --unused --check-unused
      - run: mix format --check-formatted
      - run: mix compile --warnings-as-errors
      - run: docker compose -p dripstone-ci up -d db
      - run: |
          for i in $(seq 1 30); do
            pg_isready -h localhost -U postgres && break
            sleep 1
          done
          pg_isready -h localhost -U postgres
      - run: mix ecto.create
      - run: mix ecto.migrate
      - run: mix test
