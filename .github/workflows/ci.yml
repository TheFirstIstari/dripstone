name: ci
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  ci:
    # GitHub-hosted pool: PR-controlled code MUST NEVER execute on the
    # self-hosted deploy host (holds ~/.dripstone-prod.env + Docker daemon).
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MIX_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v4
        with:
          cache: false
      - run: mix local.hex --force && mix local.rebar --force
      - run: mix deps.get
      - run: mix deps.unlock --unused --check-unused
      - run: mix format --check-formatted
      - run: mix compile --warnings-as-errors
      - run: docker compose -p dripstone-ci up -d db
      - run: |
          for i in $(seq 1 30); do
            docker compose -p dripstone-ci exec -T db pg_isready -U postgres && break
            sleep 1
          done
          docker compose -p dripstone-ci exec -T db pg_isready -U postgres
      - run: mix ecto.create
      - run: mix ecto.migrate
      - run: mix test
