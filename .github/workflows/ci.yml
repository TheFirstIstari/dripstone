name: ci
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  ci:
    # Owner decision: CI runs on the deploy host; this reopens #162 (PR code
    # executes alongside ~/.dripstone-prod.env and the Docker daemon).
    runs-on: [self-hosted, Linux, X64, cachyos-x8664]
    timeout-minutes: 30
    env:
      MIX_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v4
        with:
          cache: false
          # Pinned: the v2026.11.4 release asset 504s from GitHub-hosted
          # runners. Tool versions still come from mise.toml; unpin when
          # downloads recover.
          version: 2026.11.3
      - run: mix local.hex --force && mix local.rebar --force
      - run: mix deps.get
      - run: mix deps.unlock --unused --check-unused
      - run: mix format --check-formatted
      - run: mix compile --warnings-as-errors
      - run: docker compose -p dripstone-ci up -d db
      - run: |
          for i in $(seq 1 30); do
            docker compose -p dripstone-ci exec -T db pg_isready -U postgres && break
            sleep 1
          done
          docker compose -p dripstone-ci exec -T db pg_isready -U postgres
      - run: mix ecto.create
      - run: mix ecto.migrate
      - run: mix test
