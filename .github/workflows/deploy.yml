name: deploy
on:
  workflow_dispatch:
  workflow_run:
    workflows: [ci]
    types: [completed]
concurrency:
  group: deploy
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main') }}
    runs-on: [self-hosted, Linux, X64, cachyos-x8664]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        # empty on manual dispatch, so checkout falls back to the default branch
        with: {ref: "${{ github.event.workflow_run.head_sha }}"}
      - run: docker build -t dripstone:latest .
      - run: docker run --rm --network dripstone-net --env-file ~/.dripstone-prod.env dripstone:latest /app/bin/dripstone eval "Dripstone.Release.migrate"
      - run: |
          docker rm -f dripstone-app || true
          docker run -d --name dripstone-app --network dripstone-net --restart unless-stopped --log-opt max-size=10m --log-opt max-file=3 --env-file ~/.dripstone-prod.env -p 127.0.0.1:4000:4000 dripstone:latest
      - run: sleep 8; curl -fsS -o /dev/null http://127.0.0.1:4000/
